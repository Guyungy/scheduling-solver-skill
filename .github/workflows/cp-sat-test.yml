name: CP-SAT evaluation

on:
  push:
    branches: [cp-sat-evaluation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ortools pytest
      - name: Run CP-SAT regression test
        run: pytest -q tests/test_cp_sat_solver.py
      - name: Run solver demo
        run: python solver/cp_sat_solver.py
